           ISTO MUDA SE:
           - for adicionado Google Analytics ou outra ferramenta com cookies
           - o Calendly passar a estar embebido dentro da página

           Em qualquer desses casos, passa a ser preciso banner de
           consentimento com recusa tão fácil como a aceitação.

           Se for mesmo preciso medir visitas, preferir uma ferramenta sem
           cookies (Plausible, Umami) — mantém a página limpa e dispensa
           o banner.
           ══════════════════════════════════════════════════════════════════ -->
